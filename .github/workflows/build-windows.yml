name: Build Windows Installer

on:
  workflow_dispatch:
  workflow_call:        # lets release.yml reuse this build to attach the .exe

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Read app version
        id: ver
        shell: pwsh
        run: |
          $v = python -c "import sys; sys.path.insert(0,'src'); import version; print(version.__version__)"
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Fetch bundled binaries (yt-dlp + ffmpeg)
        run: python scripts/fetch_binaries.py

      - name: Build dictionary (Jitendex)
        run: python scripts/build_jitendex.py --file data/dicts/jitendex-yomitan.zip

      - name: Build executable with PyInstaller
        run: pyinstaller ImmersionSuite.spec --noconfirm

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Create installer output directory
        run: New-Item -ItemType Directory -Force installer\output
        shell: pwsh

      - name: Compile installer
        run: '& "C:\Program Files (x86)\Inno Setup 6\iscc.exe" installer\ImmersionSuite_Setup.iss'
        shell: pwsh

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: ImmersionSuite-v${{ steps.ver.outputs.version }}-Windows-Setup
          path: installer\output\*.exe
          retention-days: 30
